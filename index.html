<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias SP - Gestão Corporativa</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' } } } }
        }
        window.contextoGlobal = 'grade'; 
    </script>
    
    <style>
        .nav-item.active { background-color: #fff5f2; color: #e15b31; border-right: 4px solid #e15b31; font-weight: bold; }
        .dark .nav-item.active { background-color: #334155; color: #fb923c; border-right: 4px solid #fb923c; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; filter: invert(0.5); }
        .dark input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        .status-radio:checked + div { ring: 2 ring-offset-2 ring-offset-white dark:ring-offset-gray-800; transform: scale(1.05); }
        .img-bank-selected { ring: 4px solid #f97316; transform: scale(0.95); }
    </style>
</head>
<body class="bg-[#f4f7f9] text-gray-700 font-sans overflow-hidden dark:bg-dark-900 dark:text-gray-300">

    <div id="tela-login" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-gradient-to-br from-gray-100 to-gray-200 dark:from-gray-900 dark:to-gray-800">
        <div class="bg-white dark:bg-dark-800 max-w-sm w-full p-10 rounded-3xl shadow-2xl text-center border border-gray-100 dark:border-gray-700">
            <div class="mb-8">
                <div class="w-20 h-20 bg-orange-500 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg transform -rotate-6"><i class="fas fa-users-cog"></i></div>
                <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Midias SP</h2>
                <p class="text-gray-400 text-xs mt-1 uppercase tracking-widest">Acesso Corporativo</p>
            </div>
            <form id="form-login" class="space-y-4">
                <input type="text" id="login-user" placeholder="Usuário (Login)" required class="w-full p-3 bg-gray-50 dark:bg-dark-700 border dark:border-gray-600 rounded-xl outline-none focus:ring-2 focus:ring-orange-500 dark:text-white text-center">
                <div class="relative">
                    <input type="password" id="login-senha" placeholder="Senha" required class="w-full p-3 bg-gray-50 dark:bg-dark-700 border dark:border-gray-600 rounded-xl outline-none focus:ring-2 focus:ring-orange-500 dark:text-white text-center">
                    <i class="fas fa-lock absolute right-4 top-4 text-gray-400"></i>
                </div>
                <p id="login-erro" class="text-red-500 text-[10px] font-bold hidden">Usuário ou senha inválidos.</p>
                <button type="submit" class="w-full bg-orange-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-orange-700 transition transform active:scale-95">Entrar</button>
            </form>
            <p class="text-[10px] text-gray-400 mt-6 border-t dark:border-gray-700 pt-4 text-center">Use <b>admin</b> / <b>admin</b> para o primeiro acesso</p>
        </div>
    </div>

    <div id="main-layout" class="flex h-screen hidden">
        <aside class="w-64 bg-white dark:bg-dark-800 border-r dark:border-gray-700 flex flex-col py-8 items-center shrink-0">
            <div class="flex flex-col items-center mb-10 text-center px-4">
                <div class="w-20 h-20 bg-gray-100 rounded-full mb-3 flex items-center justify-center text-gray-400">
                    <i class="fas fa-user text-3xl"></i>
                </div>
                <h3 id="display-nome" class="font-bold text-gray-800 dark:text-white text-sm"></h3>
                <span id="badge-cargo" class="text-[9px] px-2 py-0.5 rounded-full font-bold uppercase mt-1"></span>
                <button onclick="window.logout()" class="text-[9px] text-red-400 hover:text-red-500 mt-3 font-bold uppercase underline">Sair</button>
            </div>
            <nav class="w-full space-y-1">
                <a href="#" onclick="window.navegar('grade')" id="nav-grade" class="nav-item active flex items-center px-8 py-3 text-sm transition"><i class="fas fa-calendar-day w-6"></i> Grade Diária</a>
                <a href="#" onclick="window.navegar('admin')" id="nav-admin" class="nav-item hidden flex items-center px-8 py-3 text-sm transition relative"><i class="fas fa-user-shield w-6"></i> Administração</a>
                <a href="#" onclick="window.navegar('standby')" id="nav-standby" class="nav-item flex items-center px-8 py-3 text-sm transition"><i class="fas fa-bell w-6"></i> Stand-By</a>
                <a href="#" onclick="window.navegar('passagem')" id="nav-passagem" class="nav-item flex items-center px-8 py-3 text-sm transition"><i class="fas fa-clipboard-list w-6"></i> Passagem</a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col min-w-0">
            <header class="h-16 bg-white dark:bg-dark-800 border-b dark:border-gray-700 flex items-center justify-between px-8">
                <div class="flex items-center gap-4">
                    <h1 id="header-title" class="text-xl font-bold dark:text-white">Grade</h1>
                    <div id="date-picker-wrapper" class="flex items-center bg-gray-100 dark:bg-dark-700 rounded-lg px-3 py-1">
                        <input type="date" id="data-selector" class="bg-transparent text-sm font-bold text-gray-700 dark:text-white outline-none">
                    </div>
                </div>
                <button onclick="window.toggleTheme()" class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500 transition"><i id="theme-icon" class="fas fa-moon"></i></button>
            </header>

            <div class="flex-1 overflow-y-auto p-8 bg-[#f8fafc] dark:bg-dark-900 relative">
                
                <div id="container-grade-standby" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2">
                        <div id="screen-grade">
                            <div id="lista-programas" class="space-y-4"></div>
                        </div>
                        <div id="screen-standby" class="hidden">
                            <div id="lista-standby" class="space-y-4"></div>
                        </div>
                    </div>
                    <aside id="right-panel">
                        <div id="view-form" class="bg-white dark:bg-dark-800 p-6 rounded-2xl shadow-lg border border-orange-200 hidden">
                            <h3 class="font-bold mb-4 uppercase text-xs flex justify-between"><span id="form-title">Novo</span><i class="fas fa-times cursor-pointer" onclick="window.cancelar()"></i></h3>
                            <form id="formCadastro" class="space-y-4">
                                <input type="hidden" id="edit-id">
                                <input id="in-titulo" placeholder="Título" required class="w-full border-b py-2 text-sm font-bold outline-none dark:bg-dark-800 dark:text-white">
                                <input id="in-sub" placeholder="Subtítulo" class="w-full border-b py-2 text-sm outline-none dark:bg-dark-800 dark:text-white">
                                <select id="in-status" class="w-full border-b py-2 text-sm outline-none dark:bg-dark-800">
                                    <option value="pendente">Pendente</option>
                                    <option value="completo">Completo</option>
                                </select>
                                <button type="submit" class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold text-xs">SALVAR</button>
                            </form>
                        </div>
                    </aside>
                </div>

                <div id="screen-admin" class="hidden absolute inset-0 bg-[#f8fafc] dark:bg-dark-900 p-8 z-20 overflow-y-auto">
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        
                        <div class="lg:col-span-8 space-y-6">
                            <div class="bg-white dark:bg-dark-800 rounded-2xl p-6 shadow-sm border dark:border-gray-700">
                                <h3 class="font-bold text-gray-800 dark:text-white mb-6 uppercase text-xs flex items-center gap-2">
                                    <i class="fas fa-users text-orange-500"></i> Gerenciar Acessos
                                </h3>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left border-collapse">
                                        <thead>
                                            <tr class="text-[10px] uppercase text-gray-400 border-b">
                                                <th class="py-3 px-2">Nome</th>
                                                <th class="py-3 px-2">Login</th>
                                                <th class="py-3 px-2">Nível</th>
                                                <th class="py-3 px-2 text-right">Ações</th>
                                            </tr>
                                        </thead>
                                        <tbody id="lista-usuarios" class="divide-y text-xs">
                                            </tbody>
                                    </table>
                                </div>
                            </div>

                            <div class="bg-white dark:bg-dark-800 p-6 rounded-2xl border dark:border-gray-700">
                                <h3 class="font-bold mb-4 text-xs uppercase"><i class="fas fa-images text-purple-500 mr-2"></i> Banco de Imagens</h3>
                                <input type="file" onchange="window.adicionarImagemBanco(this)" class="text-[10px] mb-4">
                                <div id="admin-banco-imagens" class="grid grid-cols-6 gap-2"></div>
                            </div>
                        </div>

                        <div class="lg:col-span-4">
                            <div class="bg-white dark:bg-dark-800 rounded-2xl p-6 shadow-sm border-2 border-orange-500 sticky top-0">
                                <h3 class="font-bold text-gray-800 dark:text-white mb-4 uppercase text-xs">Novo / Editar Usuário</h3>
                                <form id="formUsuario" class="space-y-3">
                                    <input type="hidden" id="admin-user-id">
                                    <div>
                                        <label class="block text-[9px] font-bold text-gray-400 uppercase">Nome</label>
                                        <input id="admin-nome" required class="w-full bg-gray-50 dark:bg-dark-700 border rounded px-3 py-2 text-xs outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-[9px] font-bold text-gray-400 uppercase">E-mail (Login)</label>
                                        <input id="admin-login" type="email" required class="w-full bg-gray-50 dark:bg-dark-700 border rounded px-3 py-2 text-xs outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-[9px] font-bold text-gray-400 uppercase">Senha</label>
                                        <input id="admin-senha" type="text" required class="w-full bg-gray-50 dark:bg-dark-700 border rounded px-3 py-2 text-xs outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-[9px] font-bold text-gray-400 uppercase">Nível</label>
                                        <select id="admin-role" class="w-full bg-gray-50 dark:bg-dark-700 border rounded px-3 py-2 text-xs outline-none">
                                            <option value="user">Usuário</option>
                                            <option value="admin">Administrador</option>
                                        </select>
                                    </div>
                                    <div class="pt-2 flex gap-2">
                                        <button type="submit" class="flex-1 bg-orange-500 text-white py-2 rounded font-bold text-[10px] uppercase">Salvar</button>
                                        <button type="button" onclick="window.limparFormAdmin()" class="px-3 bg-gray-200 text-gray-500 rounded font-bold text-[10px] uppercase">Limpar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALorKx-3IRMl1DYXM8-r5_tPb4JwfeSbQ",
            authDomain: "midias-sp.firebaseapp.com",
            databaseURL: "https://midias-sp-default-rtdb.firebaseio.com",
            projectId: "midias-sp",
            storageBucket: "midias-sp.firebasestorage.app",
            messagingSenderId: "550605985336",
            appId: "1:550605985336:web:7dd3a01aefb9248675b8cd"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const refUsers = ref(db, 'users');
        const refBancoImagens = ref(db, 'banco_imagens');

        // NAVEGAÇÃO
        window.navegar = (tela) => {
            const telas = ['screen-grade', 'screen-standby', 'screen-admin'];
            telas.forEach(t => document.getElementById(t).classList.add('hidden'));
            document.getElementById(`screen-${tela}`).classList.remove('hidden');
            
            document.getElementById('container-grade-standby').style.display = (tela === 'admin') ? 'none' : 'grid';
            
            const items = document.querySelectorAll('.nav-item');
            items.forEach(i => i.classList.remove('active'));
            document.getElementById(`nav-${tela}`).classList.add('active');
        };

        window.toggleTheme = () => document.documentElement.classList.toggle('dark');
        window.logout = () => { localStorage.clear(); location.reload(); };

        // LOGIN
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('login-user').value;
            const s = document.getElementById('login-senha').value;

            if(u === 'admin' && s === 'admin') {
                localStorage.setItem('session_active', 'true');
                localStorage.setItem('userName', 'Admin Geral');
                localStorage.setItem('userRole', 'admin');
                location.reload();
                return;
            }

            const snap = await get(refUsers);
            let found = false;
            snap.forEach(child => {
                const user = child.val();
                if(user.login === u && user.senha === s) {
                    localStorage.setItem('session_active', 'true');
                    localStorage.setItem('userName', user.nome);
                    localStorage.setItem('userRole', user.role);
                    found = true;
                    location.reload();
                }
            });
            if(!found) document.getElementById('login-erro').classList.remove('hidden');
        });

        // ADMINISTRAÇÃO DE USUÁRIOS
        const carregarAdmin = () => {
            onValue(refUsers, (snapshot) => {
                const tbody = document.getElementById('lista-usuarios');
                tbody.innerHTML = '';
                const users = snapshot.val();
                if(users) {
                    Object.keys(users).forEach(key => {
                        const u = users[key];
                        tbody.innerHTML += `
                        <tr class="border-b dark:border-gray-700">
                            <td class="py-3 px-2 font-bold">${u.nome}</td>
                            <td class="py-3 px-2">${u.login}</td>
                            <td class="py-3 px-2 uppercase font-bold text-[10px]">${u.role}</td>
                            <td class="py-3 px-2 text-right">
                                <button onclick="window.editarUsuario('${key}', '${u.nome}', '${u.login}', '${u.role}', '${u.senha}')" class="text-blue-500 mr-3"><i class="fas fa-edit"></i></button>
                                <button onclick="window.removerUsuario('${key}')" class="text-red-500"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>`;
                    });
                }
            });

            onValue(refBancoImagens, (snapshot) => {
                const container = document.getElementById('admin-banco-imagens');
                container.innerHTML = '';
                snapshot.forEach(c => {
                    container.innerHTML += `<div class="relative group"><img src="${c.val()}" class="w-full aspect-square object-cover rounded"><button onclick="window.removerImagemBanco('${c.key}')" class="absolute inset-0 bg-red-600/50 opacity-0 group-hover:opacity-100 text-white text-xs">REMOVER</button></div>`;
                });
            });
        };

        window.editarUsuario = (id, nome, login, role, senha) => {
            document.getElementById('admin-user-id').value = id;
            document.getElementById('admin-nome').value = nome;
            document.getElementById('admin-login').value = login;
            document.getElementById('admin-role').value = role;
            document.getElementById('admin-senha').value = senha;
        };

        window.removerUsuario = (id) => { if(confirm('Excluir este acesso?')) remove(ref(db, `users/${id}`)); };
        window.limparFormAdmin = () => { document.getElementById('formUsuario').reset(); document.getElementById('admin-user-id').value = ""; };

        document.getElementById('formUsuario').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('admin-user-id').value;
            const dados = {
                nome: document.getElementById('admin-nome').value,
                login: document.getElementById('admin-login').value,
                senha: document.getElementById('admin-senha').value,
                role: document.getElementById('admin-role').value
            };
            id ? update(ref(db, `users/${id}`), dados) : push(refUsers, dados);
            window.limparFormAdmin();
        });

        window.adicionarImagemBanco = (input) => {
            if(input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => push(refBancoImagens, e.target.result);
                reader.readAsDataURL(input.files[0]);
            }
        };
        window.removerImagemBanco = (id) => remove(ref(db, `banco_imagens/${id}`));

        // INIT
        if(localStorage.getItem('session_active') === 'true') {
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('main-layout').classList.remove('hidden');
            document.getElementById('display-nome').innerText = localStorage.getItem('userName');
            document.getElementById('badge-cargo').innerText = localStorage.getItem('userRole');
            if(localStorage.getItem('userRole') === 'admin') {
                document.getElementById('nav-admin').classList.remove('hidden');
                carregarAdmin();
            }
        }
    </script>
</body>
</html>
