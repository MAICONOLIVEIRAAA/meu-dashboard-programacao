<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove, update, off, get, child, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // CONFIGURAÇÕES
    const EMAILJS_PUBLIC_KEY = "SUA_PUBLIC_KEY"; 
    const EMAILJS_SERVICE_ID = "SEU_SERVICE_ID"; 
    const EMAILJS_TEMPLATE_ID = "SEU_TEMPLATE_ID"; 
    (function() { try { emailjs.init(EMAILJS_PUBLIC_KEY); } catch(e){ console.log("EmailJS não configurado"); } })();

    const firebaseConfig = {
        apiKey: "AIzaSyALorKx-3IRMl1DYXM8-r5_tPb4JwfeSbQ",
        authDomain: "midias-sp.firebaseapp.com",
        databaseURL: "https://midias-sp-default-rtdb.firebaseio.com",
        projectId: "midias-sp",
        storageBucket: "midias-sp.firebasestorage.app",
        messagingSenderId: "550605985336",
        appId: "1:550605985336:web:7dd3a01aefb9248675b8cd",
        measurementId: "G-LVE7DW8MSF"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- FUNÇÃO DE COMPRESSÃO (NOVA) ---
    // Reduz imagens para max 600px e converte para JPEG 70% (Economiza ~90% de dados)
    const redimensionarEComprimir = (file, maxWidth = 600) => {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = (maxWidth / width) * height;
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Retorna Base64 otimizado (image/jpeg, qualidade 0.7)
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        });
    };

    // DATA
    const getHojeLocal = () => { const d = new Date(); const ano = d.getFullYear(); const mes = String(d.getMonth() + 1).padStart(2, '0'); const dia = String(d.getDate()).padStart(2, '0'); return `${ano}-${mes}-${dia}`; };

    // VARS
    let dataSelecionada = getHojeLocal();
    let refProgramas = null;
    let refRelatorio = null;
    let refStandby = ref(db, 'standby');
    let refLinks = ref(db, 'links'); 
    let refCatalogo = ref(db, 'catalogo_rapido');
    let refDatas = ref(db, 'datas');
    const refUsers = ref(db, 'users');
    const refLogs = ref(db, 'logs');
    const refSolicitacoes = ref(db, 'solicitacoes');

    const dateInput = document.getElementById('data-selector');
    if(dateInput) { dateInput.value = dataSelecionada; dateInput.addEventListener('change', (e) => mudarData(e.target.value)); }

    // --- LÓGICA DO CATÁLOGO RÁPIDO ---
    
    // 1. Carrega o catálogo no Menu do Admin
    const carregarCatalogoAdmin = () => {
        onValue(refCatalogo, (snapshot) => {
            const itens = snapshot.val();
            const container = document.getElementById('lista-catalogo-admin');
            if(!container) return;
            container.innerHTML = '';
            
            if(itens) {
                Object.keys(itens).forEach(key => {
                    const item = itens[key];
                    container.innerHTML += `
                    <div class="relative group bg-gray-50 dark:bg-dark-700 rounded-lg overflow-hidden border dark:border-gray-600">
                        <img src="${item.capa}" class="w-full h-20 object-cover opacity-70 group-hover:opacity-100 transition">
                        <div class="p-2 text-xs font-bold truncate">${item.titulo}</div>
                        <button onclick="window.removerItemCatalogo('${key}')" class="absolute top-1 right-1 bg-red-500 text-white w-5 h-5 rounded flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><i class="fas fa-times text-[10px]"></i></button>
                    </div>`;
                });
            } else {
                container.innerHTML = '<p class="text-xs text-gray-400 col-span-full">Nenhum programa no catálogo.</p>';
            }
        });
    };

    // 2. Salva novo item no Catálogo (COM COMPRESSÃO)
    window.salvarItemCatalogo = async () => {
        const nome = document.getElementById('admin-cat-nome').value;
        const inputImg = document.getElementById('admin-cat-file');
        
        if(!nome) return alert("Digite o nome do programa.");
        if(!inputImg.files[0]) return alert("Selecione uma imagem de capa.");

        // ALTERAÇÃO: Usa a função de compressão
        const base64 = await redimensionarEComprimir(inputImg.files[0]);
        
        push(refCatalogo, { titulo: nome, capa: base64 });
        document.getElementById('admin-cat-nome').value = '';
        inputImg.value = ''; 
        alert("Programa adicionado ao catálogo!");
    };

    window.removerItemCatalogo = (key) => { if(confirm("Remover este programa do catálogo?")) remove(ref(db, `catalogo_rapido/${key}`)); };

    // 3. Carrega o Dropdown no Modal
    const carregarCatalogoDropdown = () => {
        onValue(refCatalogo, (snapshot) => {
            const itens = snapshot.val();
            const select = document.getElementById('select-catalogo');
            if(!select) return;
            
            select.innerHTML = '<option value="">-- Selecione para preencher --</option>';
            window.dadosCatalogoCache = {}; 
            
            if(itens) {
                Object.keys(itens).forEach(key => {
                    const item = itens[key];
                    window.dadosCatalogoCache[key] = item; 
                    const option = document.createElement('option');
                    option.value = key; 
                    option.innerText = item.titulo;
                    select.appendChild(option);
                });
            }
        });
    };

    // 4. Aplica a escolha do Dropdown
    window.aplicarCatalogo = (key) => {
        if (!key) return; 
        const item = window.dadosCatalogoCache[key];
        if(item) {
            document.getElementById('in-titulo').value = item.titulo;
            document.getElementById('in-cover-base64').value = item.capa;
            document.getElementById('cover-preview').src = item.capa;
            document.getElementById('cover-preview').classList.remove('hidden');
            document.getElementById('cover-placeholder').classList.add('hidden');
            document.getElementById('upload-area-pc').classList.add('has-image');
        }
    };

    // LOGIC
    const logActivity = (acao, detalhe) => { push(refLogs, { data: new Date().toISOString(), usuario: localStorage.getItem('userName') || 'Sistema', acao: acao, detalhe: detalhe }); }
    
    window.filtrarLista = (idLista, termo) => {
        const lista = document.getElementById(idLista);
        if (!lista) return;
        const items = lista.children;
        const t = termo.toLowerCase();
        for (let i = 0; i < items.length; i++) {
            const item = items[i];
            const texto = item.innerText.toLowerCase();
            if (texto.includes(t)) { item.classList.remove('hidden'); if(idLista !== 'lista-links-publica') item.classList.add('flex'); } 
            else { item.classList.add('hidden'); item.classList.remove('flex'); }
        }
    };

    const renderizarCards = (container, lista, tipo) => {
        if (tipo === 'grade') {
            window.dadosGrade = lista.reduce((acc, item) => { acc[item.id] = item; return acc; }, {});
        } else if (tipo === 'standby') {
            window.dadosStandby = lista.reduce((acc, item) => { acc[item.id] = item; return acc; }, {});
        }

        container.innerHTML = lista.map(p => {
            let borderClass = 'border-transparent hover:border-orange-200 dark:hover:border-gray-600';
            let bgClass = 'bg-white dark:bg-dark-800';
            if (p.status === 'completo') { borderClass = 'border-green-500 border-2'; bgClass = 'bg-green-50 dark:bg-green-900/20'; } 
            else if (p.status === 'andamento') { borderClass = 'border-orange-500 border-2'; bgClass = 'bg-orange-50 dark:bg-orange-900/20'; }
            
            const obsIcon = p.obs ? `<i class="fas fa-comment-dots text-orange-500 text-xs ml-2" title="${p.obs}"></i>` : '';

            return `
            <div class="group relative ${bgClass} p-3 rounded-xl shadow-sm border ${borderClass} transition flex gap-4" data-id="${p.id}">
                <div class="drag-handle flex items-center justify-center px-1 text-gray-300 hover:text-orange-500 cursor-grab"><i class="fas fa-grip-vertical"></i></div>
                <div class="w-24 h-24 shrink-0 rounded-lg overflow-hidden bg-gray-100 dark:bg-dark-700 relative flex items-center justify-center">${p.capa ? `<img src="${p.capa}" class="w-full h-full object-cover">` : `<i class="fas fa-image text-gray-300 text-2xl"></i>`}</div>
                <div class="flex-1 flex flex-col justify-center py-1"><div><h4 class="font-bold text-lg text-gray-800 dark:text-gray-100 leading-tight">${p.titulo}</h4><div class="flex gap-2 items-center text-sm text-gray-400 dark:text-gray-400 mt-1"><span>${p.subtitulo || ''}</span>${p.versao ? `<span class="bg-gray-100 dark:bg-dark-700 text-xs px-2 rounded border dark:border-gray-600 font-bold">${p.versao}</span>` : ''}</div></div><div class="flex items-center justify-between mt-3"><div class="flex items-center gap-2"><span class="text-xs text-gray-400 uppercase font-bold">${p.autor || 'Sistema'}</span>${obsIcon}<div class="h-3 w-px bg-gray-300"></div><div class="flex gap-1 flex-wrap">${p.tags ? p.tags.split(' ').map(tag => `<span class="bg-gray-100 dark:bg-dark-700 text-gray-600 dark:text-gray-300 text-[10px] font-bold px-1.5 py-0.5 rounded border dark:border-gray-600">${tag}</span>`).join('') : ''}${p.xd ? p.xd.split(' ').map(tag => `<span class="bg-purple-100 dark:bg-purple-900/30 text-purple-600 dark:text-purple-300 text-[10px] font-bold px-1.5 py-0.5 rounded border border-purple-200 dark:border-purple-800">${tag}</span>`).join('') : ''}${(!p.tags && !p.xd) ? '<span class="text-[10px] text-gray-300">Sem tags</span>' : ''}</div></div><button onclick="window.abrirEdicaoGlobal('${p.id}')" class="w-8 h-8 rounded-full hover:bg-orange-50 dark:hover:bg-dark-700 text-gray-300 hover:text-orange-500 transition flex items-center justify-center"><i class="fas fa-pencil-alt text-sm"></i></button></div></div>
                ${p.status === 'completo' ? '<div class="absolute top-2 right-2 text-green-500"><i class="fas fa-check-circle"></i></div>' : ''}</div>`;
        }).join('');
        
        const buscaGrade = document.getElementById('busca-grade').value; const buscaStandby = document.getElementById('busca-standby').value; if (buscaGrade && container.id === 'lista-programas') window.filtrarLista('lista-programas', buscaGrade); if (buscaStandby && container.id === 'lista-standby') window.filtrarLista('lista-standby', buscaStandby);
    }

    const carregarDadosData = (data) => {
        if(refProgramas) off(refProgramas); if(refRelatorio) off(refRelatorio);
        refProgramas = ref(db, `datas/${data}/programas`); refRelatorio = ref(db, `datas/${data}/relatorio`);
        document.getElementById('data-passagem-label').innerText = data.split('-').reverse().join('/');
        
        onValue(refProgramas, (snapshot) => { const val = snapshot.val(); const container = document.getElementById('lista-programas'); if (!val) { container.innerHTML = '<div class="text-center py-10 opacity-50"><i class="fas fa-calendar-times text-4xl mb-2"></i><p class="text-sm">Nada agendado.</p></div>'; return; } let lista = Object.keys(val).map(key => ({ id: key, ...val[key] })); lista.sort((a, b) => (a.ordem || 0) - (b.ordem || 0)); renderizarCards(container, lista, 'grade'); });
        
        onValue(refRelatorio, (snapshot) => { const feedContainer = document.getElementById('feed-passagem'); feedContainer.innerHTML = ''; const val = snapshot.val(); const currentUser = localStorage.getItem('userName'); const isAdmin = localStorage.getItem('userRole') === 'admin'; if (!val) { feedContainer.innerHTML = `<div class="text-center py-10 opacity-50"><i class="fas fa-comments text-4xl mb-2 text-gray-300"></i><p class="text-sm">Nenhuma ocorrência registrada.</p></div>`; return; } Object.keys(val).forEach(key => { const nota = val[key]; const isOwner = (nota.autor === currentUser) || isAdmin; const hora = nota.timestamp ? new Date(nota.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ''; const card = document.createElement('div'); card.className = "bg-white dark:bg-dark-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col gap-2 relative group"; card.innerHTML = `<div class="flex justify-between items-start"><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-xs font-bold uppercase">${nota.autor.substring(0,2)}</div><div><p class="text-xs font-bold text-gray-800 dark:text-white">${nota.autor}</p><p class="text-[10px] text-gray-400">${hora}</p></div></div>${isOwner ? `<div class="flex gap-2 opacity-0 group-hover:opacity-100 transition"><button onclick="window.prepararEdicaoNota('${key}', '${encodeURIComponent(nota.texto)}')" class="text-blue-400 hover:text-blue-600 text-xs"><i class="fas fa-pencil-alt"></i></button><button onclick="window.excluirNota('${key}')" class="text-red-400 hover:text-red-600 text-xs"><i class="fas fa-trash"></i></button></div>` : ''}</div><p class="text-sm text-gray-600 dark:text-gray-300 whitespace-pre-wrap leading-relaxed">${nota.texto}</p>`; feedContainer.appendChild(card); }); feedContainer.scrollTop = feedContainer.scrollHeight; });
    }

    const carregarStandby = () => { 
        onValue(refStandby, (snapshot) => { const val = snapshot.val(); const container = document.getElementById('lista-standby'); if (!val) { container.innerHTML = '<div class="text-center py-10 opacity-50"><i class="fas fa-box-open text-4xl mb-2"></i><p class="text-sm">Nenhum item em Stand-By.</p></div>'; return; } let lista = Object.keys(val).map(key => ({ id: key, ...val[key] })); renderizarCards(container, lista, 'standby'); }); 
    }

    const carregarLinks = () => {
        onValue(refLinks, (snapshot) => {
            const links = snapshot.val(); const containerPublico = document.getElementById('lista-links-publica'); const containerAdmin = document.getElementById('admin-lista-links');
            containerPublico.innerHTML = ''; if(containerAdmin) containerAdmin.innerHTML = '';
            if(links) {
                Object.keys(links).forEach(key => {
                    const l = links[key];
                    containerPublico.innerHTML += `<div class="bg-white dark:bg-dark-800 p-4 rounded-xl shadow-sm border hover:border-blue-300 dark:hover:border-blue-700 dark:border-gray-700 transition flex justify-between items-center group"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-blue-50 dark:bg-blue-900/20 text-blue-500 flex items-center justify-center"><i class="fas fa-link"></i></div><h4 class="font-bold text-sm text-gray-800 dark:text-gray-200">${l.titulo}</h4></div><a href="${l.url}" target="_blank" class="bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-blue-600 transition">Acessar</a></div>`;
                    if(containerAdmin) { containerAdmin.innerHTML += `<div class="flex justify-between items-center bg-gray-50 dark:bg-dark-700 p-2 rounded border dark:border-gray-600 text-xs"><div class="truncate mr-2"><span class="font-bold">${l.titulo}</span> <span class="text-gray-400">(${l.url})</span></div><button onclick="window.removerLink('${key}')" class="text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button></div>`; }
                });
            } else { containerPublico.innerHTML = '<p class="text-gray-400 text-sm col-span-3 text-center py-10">Nenhum link cadastrado.</p>'; if(containerAdmin) containerAdmin.innerHTML = '<p class="text-gray-400 text-xs italic">Nenhum link.</p>'; }
        });
    }

    // --- FUNÇÕES DE UPLOAD DA CAPA ATUALIZADAS (COM COMPRESSÃO) ---
    
    // 1. Ao selecionar arquivo
    window.previewCapa = async (input) => { 
        if (input.files && input.files[0]) { 
            // ALTERAÇÃO: Usa a função de compressão
            const base64 = await redimensionarEComprimir(input.files[0]);
            
            document.getElementById('cover-preview').src = base64; 
            document.getElementById('cover-preview').classList.remove('hidden'); 
            document.getElementById('cover-placeholder').classList.add('hidden'); 
            document.getElementById('in-cover-base64').value = base64;
            document.getElementById('upload-area-pc').classList.add('has-image');
        } 
    };
    
    window.triggerInputFile = (e) => { e.stopPropagation(); document.getElementById('in-cover').click(); }
    
    window.removerCapa = (e) => {
        e.stopPropagation();
        if(confirm('Remover a imagem de capa?')) {
            window.resetCapaUI();
        }
    }
    
    window.resetCapaUI = () => { 
        document.getElementById('in-cover-base64').value = ""; 
        document.getElementById('in-cover').value = ""; 
        document.getElementById('cover-preview').src = ""; 
        document.getElementById('cover-preview').classList.add('hidden'); 
        document.getElementById('cover-placeholder').classList.remove('hidden'); 
        document.getElementById('upload-area-pc').classList.remove('has-image');
    }

    const mostrarForm = () => { document.getElementById('view-form').classList.remove('hidden'); }
    const cancelar = () => { document.getElementById('view-form').classList.add('hidden'); };

    const abrirCriacao = () => { 
        document.getElementById('form-title').innerText = window.contextoGlobal === 'standby' ? "Novo em Stand-by" : "Novo Programa"; 
        document.getElementById('edit-id').value = ""; 
        document.getElementById('formCadastro').reset(); 
        document.getElementById('in-obs').value = ""; 
        window.resetCapaUI(); 
        
        document.querySelectorAll('input[name="blocos"]').forEach(cb => cb.checked = false); 
        document.querySelectorAll('input[name="xd"]').forEach(cb => cb.checked = false); 
        const radioPendente = document.querySelector('input[name="status"][value="pendente"]'); 
        if(radioPendente) radioPendente.checked = true; 
        document.getElementById('btn-delete').classList.add('hidden'); 
        
        mostrarForm(); 
    };
    
    const abrirEdicao = (p) => { 
        if(!p) return; 
        document.getElementById('edit-id').value = p.id; 
        document.getElementById('in-titulo').value = p.titulo; 
        document.getElementById('in-sub').value = p.subtitulo; 
        document.getElementById('in-versao').value = p.versao || ""; 
        document.getElementById('in-obs').value = p.obs || "";

        document.querySelectorAll('input[name="blocos"]').forEach(cb => cb.checked = false); 
        if(p.tags) { p.tags.split(' ').forEach(tag => { const cb = document.querySelector(`input[name="blocos"][value="${tag}"]`); if(cb) cb.checked = true; }); } 
        document.querySelectorAll('input[name="xd"]').forEach(cb => cb.checked = false); 
        if(p.xd) { p.xd.split(' ').forEach(tag => { const cb = document.querySelector(`input[name="xd"][value="${tag}"]`); if(cb) cb.checked = true; }); } 
        const statusVal = p.status || 'pendente'; 
        const radio = document.querySelector(`input[name="status"][value="${statusVal}"]`); 
        if(radio) radio.checked = true; 
        
        // Lógica de capa na edição
        if(p.capa) { 
            document.getElementById('in-cover-base64').value = p.capa; 
            document.getElementById('cover-preview').src = p.capa; 
            document.getElementById('cover-preview').classList.remove('hidden'); 
            document.getElementById('cover-placeholder').classList.add('hidden'); 
            document.getElementById('upload-area-pc').classList.add('has-image'); 
        } else { 
            window.resetCapaUI(); 
        } 
        
        document.getElementById('btn-delete').classList.remove('hidden'); 
        mostrarForm(); 
    };
    
    window.abrirEdicaoGlobal = (id) => { 
        let item;
        if (window.contextoGlobal === 'grade') {
            item = window.dadosGrade[id];
        } else if (window.contextoGlobal === 'standby') {
            item = window.dadosStandby[id];
        }
        if (item) abrirEdicao(item);
    };

    const deletar = () => { if(confirm('Tem certeza?')) { const id = document.getElementById('edit-id').value; const path = window.contextoGlobal === 'grade' ? `datas/${dataSelecionada}/programas/${id}` : `standby/${id}`; remove(ref(db, path)); logActivity('Excluiu', 'ID: ' + id); cancelar(); } };
    const mudarData = (novaData) => { dataSelecionada = novaData; document.getElementById('data-selector').value = dataSelecionada; carregarDadosData(dataSelecionada); carregarHistoricoPassagem(); };

    const carregarHistoricoPassagem = () => { onValue(refDatas, (snapshot) => { const datas = snapshot.val(); const container = document.getElementById('lista-historico-passagem'); container.innerHTML = ''; if(!datas) return; const datasComRelatorio = Object.keys(datas).filter(key => datas[key].relatorio).sort((a,b) => b.localeCompare(a)); datasComRelatorio.forEach(data => { const dataFormatada = data.split('-').reverse().join('/'); const ativo = (data === dataSelecionada) ? "bg-orange-100 dark:bg-orange-900/30 border-orange-200 dark:border-orange-800 text-orange-700 dark:text-orange-300" : "bg-gray-50 dark:bg-dark-700 hover:bg-gray-100 dark:hover:bg-dark-600"; const qtd = datas[data].relatorio ? Object.keys(datas[data].relatorio).length : 0; container.innerHTML += `<div onclick="window.mudarData('${data}')" class="cursor-pointer p-3 rounded-xl border dark:border-gray-600 ${ativo} transition flex justify-between items-center group"><div><p class="font-bold text-xs">${dataFormatada}</p><p class="text-[10px] opacity-70 truncate w-32">${qtd} ocorrência(s)</p></div><i class="fas fa-chevron-right text-[10px] opacity-0 group-hover:opacity-100 transition"></i></div>`; }); }); }
    
    const carregarAdminPanel = () => { 
        if(localStorage.getItem('userRole') !== 'admin') return; 
        
        carregarCatalogoAdmin();

        onValue(refSolicitacoes, (snapshot) => { 
            const s = snapshot.val(); 
            const container = document.getElementById('lista-solicitacoes'); 
            const notif = document.getElementById('notificacao-admin'); 
            container.innerHTML = ''; 
            if(s) { 
                notif.classList.remove('hidden'); 
                Object.keys(s).forEach(key => { 
                    const item = s[key]; 
                    const tipoLabel = item.tipo === 'reset' ? 'Redefinir Senha' : 'Novo Acesso'; 
                    container.innerHTML += `<div class="bg-gray-50 dark:bg-dark-700 p-3 rounded-lg text-xs flex justify-between items-start gap-2"><div><p class="font-bold text-orange-500">${tipoLabel}</p><p class="font-bold">${item.nome}</p><p class="text-gray-400">${item.contato}</p><p class="mt-1 italic">"${item.obs}"</p></div><div class="flex flex-col gap-1"><button onclick="window.aprovarSolicitacao('${key}', '${item.nome}', '${item.contato}')" class="bg-green-100 text-green-600 hover:bg-green-200 p-1 px-2 rounded font-bold" title="Aprovar">Aprovar</button><button onclick="window.reprovarSolicitacao('${key}')" class="bg-red-100 text-red-600 hover:bg-red-200 p-1 px-2 rounded font-bold" title="Reprovar">Reprovar</button></div></div>`; 
                }); 
            } else { 
                notif.classList.add('hidden'); 
                container.innerHTML = '<p class="text-xs text-gray-400 italic">Nenhuma solicitação pendente.</p>'; 
            } 
        }); 
        
        onValue(refUsers, (snapshot) => { 
            const users = snapshot.val(); 
            const tbody = document.getElementById('lista-usuarios'); 
            tbody.innerHTML = ''; 
            if(users) { 
                Object.keys(users).forEach(key => { 
                    const u = users[key]; 
                    const roleLabel = u.role === 'admin' ? '<span class="bg-red-100 text-red-600 px-2 py-0.5 rounded-full text-xs font-bold">Admin</span>' : '<span class="bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full text-xs font-bold">Usuário</span>'; 
                    
                    tbody.innerHTML += `
                    <tr class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700/50">
                        <td class="px-2 py-3 font-bold">${u.nome}</td>
                        <td class="px-2 py-3">${u.login}</td>
                        <td class="px-2 py-3">${roleLabel}</td>
                        <td class="px-2 py-3 text-right flex justify-end gap-2">
                            <button onclick="window.editarUsuario('${key}', '${u.nome}', '${u.login}', '${u.role}')" class="text-blue-500 hover:text-blue-600 p-1" title="Editar"><i class="fas fa-pencil-alt"></i></button>
                            <button onclick="window.resetarSenhaUsuario('${key}', '${u.nome}')" class="text-yellow-500 hover:text-yellow-600 p-1" title="Resetar Senha"><i class="fas fa-key"></i></button>
                            <button onclick="window.removerUsuario('${key}')" class="text-red-500 hover:text-red-600 p-1" title="Excluir"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`; 
                }); 
            } 
        }); 
        
        onValue(refLogs, (snapshot) => { const logs = snapshot.val(); const container = document.getElementById('lista-logs'); container.innerHTML = ''; if(logs) { Object.values(logs).reverse().forEach(l => { container.innerHTML += `<div class="text-xs border-l-2 border-gray-300 pl-2 py-1"><p class="font-bold dark:text-gray-300">${l.acao} <span class="font-normal text-gray-400">- ${new Date(l.data).toLocaleTimeString()}</span></p><p class="text-gray-500">${l.usuario}: ${l.detalhe}</p></div>`; }); } }); 
    }

    window.abrirCriacao = abrirCriacao; window.cancelar = cancelar; window.previewCapa = previewCapa; window.deletar = deletar; window.mudarData = mudarData; window.aprovarSolicitacao = (id, nome, contato) => { const senhaPadrao = "1234"; if(confirm(`Aprovar acesso para ${nome}?\nLogin: ${contato}\nSenha padrão: ${senhaPadrao}`)) { push(refUsers, { nome: nome, login: contato, senha: senhaPadrao, role: "user", forceReset: true }); remove(ref(db, `solicitacoes/${id}`)); logActivity('Aprovou Solicitação', nome); window.enviarEmailNotificacao(nome, contato, senhaPadrao); } }; window.reprovarSolicitacao = (id) => { if(confirm('Reprovar pedido?')) { remove(ref(db, `solicitacoes/${id}`)); logActivity('Reprovou Solicitação', 'ID: ' + id); } }; window.abrirSolicitacao = (tipo) => { document.getElementById('modal-solicitacao').classList.remove('hidden'); document.getElementById('tipo-solicitacao').value = tipo; document.getElementById('titulo-solicitacao').innerText = tipo === 'reset' ? 'Redefinir Senha' : 'Novo Usuário'; document.getElementById('form-solicitacao').reset(); }; window.fecharSolicitacao = () => document.getElementById('modal-solicitacao').classList.add('hidden'); 
    
    window.editarUsuario = (id, nome, login, role) => { 
        document.getElementById('container-senha').classList.add('hidden');
        document.getElementById('admin-user-id').value = id; 
        document.getElementById('admin-nome').value = nome; 
        document.getElementById('admin-login').value = login; 
        document.getElementById('admin-role').value = role; 
    }; 

    window.limparFormAdmin = () => { 
        document.getElementById('formUsuario').reset(); 
        document.getElementById('admin-user-id').value = ""; 
        document.getElementById('container-senha').classList.remove('hidden');
    };

    window.resetarSenhaUsuario = (id, nome) => {
        const senhaPadrao = "mudar123";
        if(confirm(`Tem certeza que deseja resetar a senha de ${nome}?\n\nA nova senha será: ${senhaPadrao}\nO usuário será obrigado a trocá-la no próximo login.`)) {
            update(ref(db, `users/${id}`), { senha: senhaPadrao, forceReset: true });
            logActivity('Resetar Senha', `Usuário: ${nome}`);
            alert('Senha resetada com sucesso!');
        }
    };

    window.removerUsuario = (id) => { if(confirm('Remover usuário?')) { remove(ref(db, `users/${id}`)); logActivity('Remover Usuário', id); } }; 
    window.enviarNota = () => { const txt = document.getElementById('texto-passagem').value.trim(); const editingId = document.getElementById('note-id-editing').value; const currentUser = localStorage.getItem('userName'); if(!txt) return; if (editingId) { update(ref(db, `datas/${dataSelecionada}/relatorio/${editingId}`), { texto: txt, editadoEm: new Date().toISOString() }); alert("Nota atualizada!"); } else { push(ref(db, `datas/${dataSelecionada}/relatorio`), { texto: txt, autor: currentUser, timestamp: new Date().toISOString() }); } document.getElementById('texto-passagem').value = ''; window.cancelarEdicaoNota(); }; window.prepararEdicaoNota = (id, textoEncoded) => { document.getElementById('texto-passagem').value = decodeURIComponent(textoEncoded); document.getElementById('note-id-editing').value = id; document.getElementById('btn-cancel-note').classList.remove('hidden'); document.getElementById('texto-passagem').focus(); }; window.cancelarEdicaoNota = () => { document.getElementById('note-id-editing').value = ''; document.getElementById('texto-passagem').value = ''; document.getElementById('btn-cancel-note').classList.add('hidden'); }; window.excluirNota = (id) => { if(confirm("Excluir esta nota?")) remove(ref(db, `datas/${dataSelecionada}/relatorio/${id}`)); }; window.abrirModal = () => document.getElementById('modal-foto').classList.remove('hidden'); window.fecharModal = () => document.getElementById('modal-foto').classList.add('hidden'); 
    
    // ALTERAÇÃO: Usa a função de compressão (foto perfil)
    window.uploadFotoPerfil = async (input) => { 
        if (input.files[0]) { 
            const base64 = await redimensionarEComprimir(input.files[0], 200); // Perfil pequeno
            salvarFotoLocal(base64); 
        } 
    };
    
    window.removerLink = (id) => { if(confirm('Remover link?')) remove(ref(db, `links/${id}`)); };

    const salvarFotoLocal = (url) => { localStorage.setItem('userAvatar', url); carregarFotoLocal(); window.fecharModal(); }
    const carregarFotoLocal = () => { const url = localStorage.getItem('userAvatar'); if(url) { document.getElementById('profile-img').src = url; document.getElementById('profile-img-small').src = url; } }
    
    window.navegar = (tela) => {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('screen-grade').classList.add('hidden');
        document.getElementById('screen-standby').classList.add('hidden');
        document.getElementById('screen-passagem').classList.add('hidden');
        document.getElementById('screen-admin').classList.add('hidden');
        document.getElementById('screen-links').classList.add('hidden'); 
        document.getElementById('layout-programacao').classList.add('hidden');
        document.getElementById('date-picker-wrapper').classList.add('hidden');
        
        window.cancelar(); 

        if(tela === 'grade') {
            document.getElementById('nav-grade').classList.add('active');
            document.getElementById('layout-programacao').classList.remove('hidden');
            document.getElementById('screen-grade').classList.remove('hidden');
            document.getElementById('header-title').innerHTML = '<i class="fas fa-circle text-[8px] text-green-500 mr-2 animate-pulse"></i> Grade';
            document.getElementById('date-picker-wrapper').classList.remove('hidden');
            window.contextoGlobal = 'grade'; 
        } else if (tela === 'standby') {
            document.getElementById('nav-standby').classList.add('active');
            document.getElementById('layout-programacao').classList.remove('hidden');
            document.getElementById('screen-standby').classList.remove('hidden');
            document.getElementById('header-title').innerHTML = 'Stand-By';
            window.contextoGlobal = 'standby'; 
        } else if (tela === 'passagem') {
            document.getElementById('nav-passagem').classList.add('active');
            document.getElementById('screen-passagem').classList.remove('hidden');
            document.getElementById('header-title').innerHTML = 'Passagem de Serviço';
        } else if (tela === 'admin') {
            document.getElementById('nav-admin').classList.add('active');
            document.getElementById('screen-admin').classList.remove('hidden');
            document.getElementById('header-title').innerHTML = 'Administração';
        } else if (tela === 'links') {
            document.getElementById('nav-links').classList.add('active');
            document.getElementById('screen-links').classList.remove('hidden');
            document.getElementById('header-title').innerHTML = 'Links Úteis';
        }
    }

    window.toggleTheme = () => { document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); document.getElementById('theme-icon').className = document.documentElement.classList.contains('dark') ? 'fas fa-sun' : 'fas fa-moon'; }

    const aplicarPermissoes = () => {
        const role = localStorage.getItem('userRole'); const isAdmin = (role === 'admin'); const navAdmin = document.getElementById('nav-admin'); const badge = document.getElementById('badge-cargo');
        if(isAdmin) { if(navAdmin) navAdmin.classList.remove('hidden'); if(badge) { badge.className = "text-[9px] px-2 py-0.5 rounded-full font-bold uppercase mt-1 bg-red-100 text-red-600"; badge.innerText = "Administrador"; } } 
        else { if(navAdmin) navAdmin.classList.add('hidden'); if(badge) { badge.className = "text-[9px] px-2 py-0.5 rounded-full font-bold uppercase mt-1 bg-blue-100 text-blue-600"; badge.innerText = "Usuário"; } }
    }

    const verificarSessao = () => { if (localStorage.getItem('theme') === 'dark') { document.documentElement.classList.add('dark'); document.getElementById('theme-icon').className = 'fas fa-sun'; } if (localStorage.getItem('session_active') === 'true') { document.getElementById('tela-login').classList.add('hidden'); document.getElementById('main-layout').classList.remove('hidden'); if(document.getElementById('display-nome')) { document.getElementById('display-nome').innerText = localStorage.getItem('userName'); } carregarFotoLocal(); aplicarPermissoes(); } }
    window.logout = () => { localStorage.removeItem('session_active'); localStorage.removeItem('userRole'); localStorage.removeItem('userName'); location.reload(); }

    // LISTENERS DE FORMULÁRIO
    document.getElementById('form-login').addEventListener('submit', async (e) => { e.preventDefault(); const loginInput = document.getElementById('login-user').value; const senhaInput = document.getElementById('login-senha').value; const snapshotUsers = await get(refUsers); if (!snapshotUsers.exists() && loginInput === 'admin' && senhaInput === 'admin') { push(refUsers, { nome: "Administrador", login: "admin", senha: "admin", role: "admin", forceReset: false }); localStorage.setItem('session_active', 'true'); localStorage.setItem('userName', 'Administrador'); localStorage.setItem('userRole', 'admin'); location.reload(); return; } let userFound = null; let userKey = null; if (snapshotUsers.exists()) { snapshotUsers.forEach((child) => { const u = child.val(); if (u.login === loginInput && u.senha === senhaInput) { userFound = u; userKey = child.key; } }); } if (userFound) { if(userFound.forceReset === true) { document.getElementById('modal-force-reset').classList.remove('hidden'); document.getElementById('reset-user-id').value = userKey; return; } localStorage.setItem('session_active', 'true'); localStorage.setItem('userName', userFound.nome); localStorage.setItem('userRole', userFound.role); location.reload(); } else { document.getElementById('login-erro').classList.remove('hidden'); } });
    document.getElementById('form-force-reset').addEventListener('submit', async (e) => { e.preventDefault(); const id = document.getElementById('reset-user-id').value; const s1 = document.getElementById('nova-senha-1').value; const s2 = document.getElementById('nova-senha-2').value; if(s1 !== s2) { alert("Senhas não coincidem!"); return; } if(s1.length < 4) { alert("Senha curta!"); return; } await update(ref(db, `users/${id}`), { senha: s1, forceReset: false }); alert("Senha atualizada! Faça login."); location.reload(); });
    
    document.getElementById('formCadastro').addEventListener('submit', (e) => { 
        e.preventDefault(); 
        const id = document.getElementById('edit-id').value; 
        const blocosChecked = Array.from(document.querySelectorAll('input[name="blocos"]:checked')).map(cb => cb.value).join(' '); 
        const xdChecked = Array.from(document.querySelectorAll('input[name="xd"]:checked')).map(cb => cb.value).join(' '); 
        const statusChecked = document.querySelector('input[name="status"]:checked').value; 
        
        const dados = { 
            titulo: document.getElementById('in-titulo').value, 
            subtitulo: document.getElementById('in-sub').value, 
            versao: document.getElementById('in-versao').value, 
            obs: document.getElementById('in-obs').value,
            tags: blocosChecked, 
            xd: xdChecked, 
            status: statusChecked, 
            capa: document.getElementById('in-cover-base64').value, 
            autor: localStorage.getItem('userName') 
        }; 
        
        let dbRef; 
        if (window.contextoGlobal === 'grade') { 
            dbRef = id ? ref(db, `datas/${dataSelecionada}/programas/${id}`) : ref(db, `datas/${dataSelecionada}/programas`); 
        } else { 
            dbRef = id ? ref(db, `standby/${id}`) : ref(db, `standby`); 
        } 
        
        if (id) { 
            update(dbRef, dados); 
            logActivity('Editou', dados.titulo + (window.contextoGlobal === 'standby' ? ' (SB)' : '')); 
        } else { 
            dados.ordem = 999; 
            push(dbRef, dados); 
            logActivity('Criou', dados.titulo + (window.contextoGlobal === 'standby' ? ' (SB)' : '')); 
        } 
        window.cancelar(); 
    });

    document.getElementById('form-solicitacao').addEventListener('submit', (e) => { e.preventDefault(); const dados = { tipo: document.getElementById('tipo-solicitacao').value, nome: document.getElementById('solic-nome').value, contato: document.getElementById('solic-contato').value, obs: document.getElementById('solic-obs').value, data: new Date().toISOString() }; push(refSolicitacoes, dados); alert("Solicitação enviada!"); window.fecharSolicitacao(); });
    
    document.getElementById('formUsuario').addEventListener('submit', (e) => { 
        e.preventDefault(); 
        const id = document.getElementById('admin-user-id').value; 
        const nome = document.getElementById('admin-nome').value;
        const login = document.getElementById('admin-login').value;
        const role = document.getElementById('admin-role').value;
        const senhaInicial = document.getElementById('admin-senha').value;
        const dados = { nome: nome, login: login, role: role };
        if(id) { 
            update(ref(db, `users/${id}`), dados); 
            logActivity('Editar Usuário', login); 
        } else { 
            dados.senha = senhaInicial || "1234";
            dados.forceReset = true;
            push(refUsers, dados); 
            logActivity('Criar Usuário', login); 
        } 
        window.limparFormAdmin(); 
    });
    
    document.getElementById('formLink').addEventListener('submit', (e) => { e.preventDefault(); const titulo = document.getElementById('link-titulo').value; const url = document.getElementById('link-url').value; push(refLinks, { titulo: titulo, url: url }); document.getElementById('link-titulo').value = ''; document.getElementById('link-url').value = ''; });

    // INIT
    verificarSessao();
    carregarDadosData(dataSelecionada);
    carregarStandby();
    carregarHistoricoPassagem();
    carregarAdminPanel();
    carregarLinks();
    carregarCatalogoDropdown(); 
    
    new Sortable(document.getElementById('lista-programas'), { handle: '.drag-handle', animation: 150, ghostClass: 'ghost-card', onEnd: function (evt) { const items = document.querySelectorAll('#lista-programas [data-id]'); items.forEach((item, index) => { const id = item.getAttribute('data-id'); update(ref(db, `datas/${dataSelecionada}/programas/${id}`), { ordem: index }); }); } });
    new Sortable(document.getElementById('lista-standby'), { handle: '.drag-handle', animation: 150, ghostClass: 'ghost-card' });

</script>
