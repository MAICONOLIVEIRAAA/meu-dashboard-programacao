<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias São Paulo - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-700">

    <div class="flex h-screen">
        <aside class="w-64 bg-white border-r flex flex-col items-center py-8">
            <div class="flex flex-col items-center mb-10">
                <div class="w-20 h-20 bg-gray-300 rounded-full mb-2 overflow-hidden">
                    <img src="https://via.placeholder.com/150" alt="Avatar">
                </div>
                <h3 class="font-bold text-lg">Maicon Carlos</h3>
                <p class="text-xs text-gray-400">De Araujo Oliveira</p>
            </div>

            <nav class="w-full px-6 space-y-4">
                <a href="#" class="flex items-center space-x-3 text-gray-500 hover:text-orange-600"><i class="fas fa-th-large"></i> <span>Treinamento</span></a>
                <a href="#" class="flex items-center space-x-3 text-orange-600 font-bold border-r-4 border-orange-600"><i class="fas fa-calendar-alt"></i> <span>Programação</span></a>
                <a href="#" class="flex items-center space-x-3 text-gray-500 hover:text-orange-600"><i class="fas fa-bell"></i> <span>Stand-By</span></a>
                <a href="#" class="flex items-center space-x-3 text-gray-500 hover:text-orange-600"><i class="fas fa-play-circle"></i> <span>Globoplay</span></a>
                <a href="#" class="flex items-center space-x-3 text-gray-500 hover:text-orange-600"><i class="fas fa-file-alt"></i> <span>Scripts</span></a>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <header class="flex justify-between items-center mb-8">
                <h1 class="text-2xl font-bold">Midias São Paulo</h1>
                <div class="flex space-x-4 text-sm text-gray-400">
                    <span>Aspera</span><span>Backstage</span><span>Grabyo</span>
                    <i class="fas fa-search ml-4"></i>
                </div>
            </header>

            <div class="flex space-x-4 mb-6">
                <input type="text" placeholder="Pesquisar..." class="flex-1 p-2 rounded-lg border focus:outline-orange-500">
                <input type="date" value="2025-07-02" class="p-2 rounded-lg border text-gray-500">
                <button class="bg-orange-500 text-white px-4 rounded-lg">+</button>
            </div>

            <div class="grid grid-cols-3 gap-6">
                <div class="col-span-2 space-y-4" id="program-list">
                    <div class="bg-white p-4 rounded-xl shadow-sm flex space-x-4 border-l-4 border-orange-500">
                        <img src="https://via.placeholder.com/100x60" class="rounded-lg object-cover">
                        <div class="flex-1">
                            <div class="flex justify-between">
                                <h4 class="font-bold">História de Amor</h4>
                                <span class="bg-green-100 text-green-600 text-xs px-2 py-1 rounded">No ar agora</span>
                            </div>
                            <p class="text-xs text-gray-400">Edição Especial - Cap 114</p>
                            <div class="mt-2 text-orange-600 font-bold">00:00 <span class="text-gray-400 font-normal text-xs ml-2">Maicon Carlos</span></div>
                        </div>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm">
                        <h4 class="font-bold mb-4">História de Amor</h4>
                        <textarea class="w-full p-2 border rounded-lg h-24 text-sm bg-gray-50" placeholder="Digite uma passagem de serviço..."></textarea>
                        <div class="mt-4 flex justify-between">
                            <button class="text-gray-400 text-sm">Cancelar</button>
                            <button class="bg-orange-500 text-white px-6 py-2 rounded-lg font-bold">Enviar</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Lógica simples para carregar dados do Backend depois
        async function fetchPrograms() {
            try {
                const res = await fetch('http://localhost:3000/api/programacao');
                const data = await res.json();
                console.log("Programas carregados:", data);
            } catch (err) {
                console.log("Servidor offline, usando dados estáticos.");
            }
        }
        fetchPrograms();
    </script>
</body>
</html>
