<div id="screen-admin" class="hidden absolute top-0 left-0 right-0 bottom-0 bg-[#f8fafc] dark:bg-dark-900 p-8 z-20 overflow-y-auto">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 pb-10">
                        
                        <div class="lg:col-span-2 space-y-6">
                            
                            <div class="bg-white dark:bg-dark-800 rounded-2xl p-6 shadow-sm border border-purple-100 dark:border-purple-900/30">
                                <h3 class="font-bold text-gray-800 dark:text-white mb-4 flex items-center gap-2"><i class="fas fa-images text-purple-500"></i> Banco de Imagens</h3>
                                <div class="flex gap-2 items-center mb-4">
                                    <label class="bg-purple-100 dark:bg-purple-900/30 text-purple-600 px-4 py-2 rounded-lg font-bold text-xs cursor-pointer hover:bg-purple-200 dark:hover:bg-purple-800">
                                        <i class="fas fa-upload mr-2"></i> Adicionar ao Banco
                                        <input type="file" class="hidden" accept="image/*" onchange="window.adicionarImagemBanco(this)">
                                    </label>
                                </div>
                                <div id="admin-banco-imagens" class="grid grid-cols-4 sm:grid-cols-6 gap-3 max-h-40 overflow-y-auto pr-2"></div>
                            </div>

                            <div class="bg-white dark:bg-dark-800 rounded-2xl p-6 shadow-sm border dark:border-gray-700">
                                <h3 class="font-bold text-gray-800 dark:text-white mb-6 uppercase text-sm flex items-center gap-2">
                                    <i class="fas fa-users text-orange-500"></i> Usuários Cadastrados
                                </h3>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left border-collapse">
                                        <thead>
                                            <tr class="text-[10px] uppercase text-gray-400 border-b dark:border-gray-700">
                                                <th class="py-3 px-2">Nome</th>
                                                <th class="py-3 px-2">Login/E-mail</th>
                                                <th class="py-3 px-2">Nível</th>
                                                <th class="py-3 px-2 text-right">Ações</th>
                                            </tr>
                                        </thead>
                                        <tbody id="lista-usuarios" class="divide-y dark:divide-gray-700">
                                            </tbody>
                                    </table>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="bg-white dark:bg-dark-800 rounded-2xl p-6 shadow-sm border border-red-200 dark:border-red-900/50">
                                    <h3 class="font-bold text-red-600 mb-2 flex items-center gap-2"><i class="fas fa-trash-alt"></i> Manutenção</h3>
                                    <div class="flex gap-2">
                                        <select id="limpeza-periodo" class="flex-1 bg-gray-50 dark:bg-dark-700 border dark:border-gray-600 rounded-lg px-2 py-2 text-xs dark:text-white outline-none">
                                            <option value="30">30 Dias</option>
                                            <option value="90">90 Dias</option>
                                        </select>
                                        <button onclick="window.executarLimpeza()" class="bg-red-500 text-white px-3 py-2 rounded-lg font-bold text-[10px] uppercase">Limpar</button>
                                    </div>
                                </div>
                                <div class="bg-white dark:bg-dark-800 rounded-2xl p-6 shadow-sm border border-blue-100 dark:border-blue-900/30">
                                    <h3 class="font-bold text-blue-500 mb-2 flex items-center gap-2"><i class="fas fa-link"></i> Novo Link Útil</h3>
                                    <form id="formLink" class="space-y-2">
                                        <input id="link-titulo" placeholder="Título" required class="w-full bg-gray-50 dark:bg-dark-700 border dark:border-gray-600 rounded-lg px-3 py-1.5 text-xs dark:text-white outline-none">
                                        <div class="flex gap-2">
                                            <input id="link-url" placeholder="URL" required class="flex-1 bg-gray-50 dark:bg-dark-700 border dark:border-gray-600 rounded-lg px-3 py-1.5 text-xs dark:text-white outline-none">
                                            <button type="submit" class="bg-blue-500 text-white px-3 rounded-lg font-bold text-[10px] uppercase">Add</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div class="bg-white dark:bg-dark-800 rounded-2xl p-6 shadow-sm border border-orange-200 dark:border-gray-700">
                                <h3 class="font-bold text-gray-800 dark:text-white mb-6 uppercase text-sm">Criar / Editar Usuário</h3>
                                <form id="formUsuario" class="space-y-4">
                                    <input type="hidden" id="admin-user-id">
                                    <div>
                                        <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Nome Completo</label>
                                        <input id="admin-nome" required class="w-full bg-gray-50 dark:bg-dark-700 border dark:border-gray-600 rounded-lg px-3 py-2 text-sm dark:text-white outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Login (Email)</label>
                                        <input id="admin-login" type="email" required class="w-full bg-gray-50 dark:bg-dark-700 border dark:border-gray-600 rounded-lg px-3 py-2 text-sm dark:text-white outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Senha (Provisória)</label>
                                        <input id="admin-senha" type="text" required class="w-full bg-gray-50 dark:bg-dark-700 border dark:border-gray-600 rounded-lg px-3 py-2 text-sm dark:text-white outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Nível de Acesso</label>
                                        <select id="admin-role" class="w-full bg-gray-50 dark:bg-dark-700 border dark:border-gray-600 rounded-lg px-3 py-2 text-sm dark:text-white outline-none">
                                            <option value="user">Usuário Comum</option>
                                            <option value="admin">Administrador</option>
                                        </select>
                                    </div>
                                    <div class="pt-2 flex gap-2">
                                        <button type="submit" class="flex-1 bg-orange-500 text-white py-2 rounded-lg font-bold text-xs uppercase hover:bg-orange-600 shadow-md">Salvar Usuário</button>
                                        <button type="button" onclick="window.limparFormAdmin()" class="px-3 bg-gray-200 dark:bg-gray-700 text-gray-500 rounded-lg font-bold text-xs uppercase hover:bg-gray-300">Limpar</button>
                                    </div>
                                </form>
                            </div>

                            <div class="bg-white dark:bg-dark-800 rounded-2xl p-6 shadow-sm border border-red-100 dark:border-red-900/30">
                                <h3 class="font-bold text-gray-800 dark:text-white mb-4 flex items-center gap-2"><i class="fas fa-bell text-red-500 animate-pulse"></i> Solicitações</h3>
                                <div id="lista-solicitacoes" class="space-y-3"></div>
                            </div>

                            <div class="bg-white dark:bg-dark-800 rounded-2xl p-6 shadow-sm border dark:border-gray-700">
                                <h3 class="font-bold text-gray-800 dark:text-white mb-4 flex items-center gap-2"><i class="fas fa-history text-blue-500"></i> Logs do Sistema</h3>
                                <div class="max-h-40 overflow-y-auto space-y-2 pr-2" id="lista-logs"></div>
                            </div>
                        </div>

                    </div>
                </div>
