<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Capa - Estilo Modal</title>
    <style>
        /* =========================================
           ESTILOS GERAIS (Para simular o modal)
           ========================================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a202c; /* Fundo bem escuro */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .modal-simulation {
            background-color: #2d3748; /* Cor de fundo do modal */
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #4a5568;
        }

        h2 {
            color: white;
            margin-top: 0;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        /* =========================================
           ESTILOS DO COMPONENTE DE UPLOAD
           ========================================= */
        .upload-area {
            width: 100%;
            height: 220px;
            background-color: #4a5568; /* Fundo da área de upload */
            border-radius: 8px;
            position: relative; /* Importante para o posicionamento absoluto dos filhos */
            overflow: hidden;   /* Garante que a imagem não saia da borda arredondada */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px dashed #718096;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .upload-area:hover {
            border-color: #63b3ed; /* Azul claro ao passar o mouse */
            background-color: #536175;
        }

        /* Quando tem imagem, a borda fica sólida */
        .upload-area.has-image {
            border-style: solid;
            border-color: transparent;
        }

        /* --- Placeholder (Texto e Ícone) --- */
        .placeholder {
            text-align: center;
            color: #cbd5e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none; /* O clique passa direto para a div pai */
        }

        .placeholder svg {
            width: 48px;
            height: 48px;
            fill: #a0aec0;
        }

        .placeholder span {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* --- Imagem de Preview --- */
        .img-preview {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cobre toda a área sem distorcer */
            position: absolute;
            top: 0;
            left: 0;
            display: none; /* Oculta por padrão */
        }

        /* --- Camada de Ações (Overlay) --- */
        .actions-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 32, 44, 0.85); /* Fundo escuro semi-transparente */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            
            /* Lógica de Visibilidade */
            opacity: 0;
            pointer-events: none; /* Não clica quando invisível */
            transition: opacity 0.3s ease;
        }

        /* REGRA MÁGICA: Só mostra o overlay se tiver a classe .has-image E o mouse estiver em cima */
        .upload-area.has-image:hover .actions-overlay {
            opacity: 1;
            pointer-events: all;
        }

        /* --- Botões --- */
        .btn {
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 140px;
            justify-content: center;
            transition: transform 0.1s, background 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-replace {
            background-color: #3182ce; /* Azul */
            color: white;
        }
        .btn-replace:hover { background-color: #2b6cb0; }

        .btn-delete {
            background-color: #e53e3e; /* Vermelho */
            color: white;
        }
        .btn-delete:hover { background-color: #c53030; }

    </style>
</head>
<body>

    <div class="modal-simulation">
        <h2>Imagem da Capa</h2>

        <div class="upload-area" id="uploadArea">
            
            <input type="file" id="fileInput" accept="image/*" hidden>

            <div class="placeholder" id="placeholder">
                <svg viewBox="0 0 24 24">
                    <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                </svg>
                <span>SELECIONAR IMAGEM</span>
            </div>

            <img src="" alt="Preview" class="img-preview" id="imgPreview">

            <div class="actions-overlay" id="actionsOverlay">
                <button type="button" class="btn btn-replace" id="btnReplace">
                    🔄 Substituir
                </button>
                <button type="button" class="btn btn-delete" id="btnDelete">
                    🗑️ Excluir
                </button>
            </div>

        </div>
    </div>

    <script>
        // Seleção dos Elementos
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const imgPreview = document.getElementById('imgPreview');
        const placeholder = document.getElementById('placeholder');
        const btnReplace = document.getElementById('btnReplace');
        const btnDelete = document.getElementById('btnDelete');

        // 1. Clique na área principal (apenas se não tiver imagem ainda)
        uploadArea.addEventListener('click', () => {
            if (!uploadArea.classList.contains('has-image')) {
                fileInput.click();
            }
        });

        // 2. Quando o usuário seleciona um arquivo
        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];

            if (file) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    // Atualiza o src da imagem
                    imgPreview.src = e.target.result;
                    imgPreview.style.display = 'block'; // Mostra a imagem
                    
                    // Esconde o placeholder
                    placeholder.style.display = 'none';

                    // Adiciona estado de "com imagem" para ativar o hover CSS
                    uploadArea.classList.add('has-image');
                }

                reader.readAsDataURL(file);
            }
        });

        // 3. Botão Substituir
        btnReplace.addEventListener('click', (e) => {
            e.stopPropagation(); // Impede que o clique suba para o container pai
            fileInput.click();   // Reabre a janela de arquivos
        });

        // 4. Botão Excluir
        btnDelete.addEventListener('click', (e) => {
            e.stopPropagation(); // Impede conflitos
            
            // Reseta tudo
            fileInput.value = '';             // Limpa o input
            imgPreview.src = '';              // Limpa o src
            imgPreview.style.display = 'none'; // Esconde a tag img
            
            placeholder.style.display = 'flex'; // Volta o texto inicial
            
            uploadArea.classList.remove('has-image'); // Remove o estado (desativa o hover do overlay)
        });

    </script>
</body>
</html>
