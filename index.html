<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias São Paulo - Gestão Corporativa</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' } } } }
        }
        window.contextoGlobal = 'grade'; 
    </script>
    
    <style>
        .nav-item.active { background-color: #fff5f2; color: #e15b31; border-right: 4px solid #e15b31; font-weight: bold; }
        .dark .nav-item.active { background-color: #334155; color: #fb923c; border-right: 4px solid #fb923c; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; filter: invert(0.5); }
        .dark input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        .status-radio:checked + div { ring-2 ring-offset-2 ring-offset-white dark:ring-offset-gray-800; transform: scale(1.05); }
        .img-bank-selected { ring: 4px solid #f97316; transform: scale(0.95); }
    </style>
</head>
<body class="bg-[#f4f7f9] text-gray-700 font-sans overflow-hidden dark:bg-dark-900 dark:text-gray-300">

    <div id="tela-login" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-gradient-to-br from-gray-100 to-gray-200 dark:from-gray-900 dark:to-gray-800">
        <div class="bg-white dark:bg-dark-800 max-w-sm w-full p-10 rounded-3xl shadow-2xl text-center border border-gray-100 dark:border-gray-700">
            <div class="mb-8">
                <div class="w-20 h-20 bg-orange-500 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg transform -rotate-6"><i class="fas fa-users-cog"></i></div>
                <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Midias São Paulo</h2>
                <p class="text-gray-400 text-xs mt-1 uppercase tracking-widest">Acesso Corporativo</p>
            </div>
            <form id="form-login" class="space-y-4">
                <input type="text" id="login-user" placeholder="Usuário (Login)" required class="w-full p-3 bg-gray-50 dark:bg-dark-700 border dark:border-gray-600 rounded-xl outline-none focus:ring-2 focus:ring-orange-500 dark:text-white text-center">
                <div class="relative">
                    <input type="password" id="login-senha" placeholder="Senha" required class="w-full p-3 bg-gray-50 dark:bg-dark-700 border dark:border-gray-600 rounded-xl outline-none focus:ring-2 focus:ring-orange-500 dark:text-white text-center">
                    <i class="fas fa-lock absolute right-4 top-4 text-gray-400"></i>
                </div>
                <p id="login-erro" class="text-red-500 text-[10px] font-bold hidden">Usuário ou senha inválidos.</p>
                <button type="submit" class="w-full bg-orange-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-orange-700 transition transform active:scale-95">Entrar</button>
            </form>
            <p class="text-[10px] text-gray-400 mt-6 border-t dark:border-gray-700 pt-4">Primeiro acesso? Use admin / admin</p>
        </div>
    </div>

    <div id="main-layout" class="flex h-screen hidden">
        <aside class="w-64 bg-white dark:bg-dark-800 border-r dark:border-gray-700 flex flex-col py-8 items-center shrink-0">
            <div class="flex flex-col items-center mb-10 text-center px-4">
                <div class="w-20 h-20 relative group cursor-pointer mb-3" onclick="window.abrirModal()">
                    <img id="profile-img" src="" class="w-full h-full rounded-full border dark:border-gray-600 shadow-sm object-cover bg-gray-100 dark:bg-gray-700">
                    <div class="absolute inset-0 bg-black bg-opacity-40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-300"><i class="fas fa-camera text-white"></i></div>
                </div>
                <h3 id="display-nome" class="font-bold text-gray-800 dark:text-white text-sm"></h3>
                <span id="badge-cargo" class="text-[9px] px-2 py-0.5 rounded-full font-bold uppercase mt-1"></span>
                <button onclick="window.logout()" class="text-[9px] text-red-400 hover:text-red-500 mt-3 font-bold uppercase underline">Sair</button>
            </div>
            
            <nav class="w-full space-y-1">
                <a href="#" onclick="window.navegar('grade')" id="nav-grade" class="nav-item active flex items-center px-8 py-3 text-sm text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                    <i class="fas fa-calendar-day w-6"></i> Programação Diária
                </a>
                <a href="#" onclick="window.navegar('standby')" id="nav-standby" class="nav-item flex items-center px-8 py-3 text-sm text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                    <i class="fas fa-bell w-6"></i> Stand-By
                </a>
                <a href="#" onclick="window.navegar('links')" id="nav-links" class="nav-item flex items-center px-8 py-3 text-sm text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                    <i class="fas fa-link w-6"></i> Links Úteis
                </a>
                <a href="#" onclick="window.navegar('passagem')" id="nav-passagem" class="nav-item flex items-center px-8 py-3 text-sm text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                    <i class="fas fa-clipboard-list w-6"></i> Passagem de Serviço
                </a>
                <a href="#" onclick="window.navegar('admin')" id="nav-admin" class="nav-item hidden flex items-center px-8 py-3 text-sm text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition relative">
                    <i class="fas fa-user-shield w-6"></i> Administração
                </a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col min-w-0">
            <header class="h-16 bg-white dark:bg-dark-800 border-b dark:border-gray-700 flex items-center justify-between px-8">
                <div class="flex items-center gap-4">
                    <h1 id="header-title" class="text-xl font-bold dark:text-white flex items-center">Grade</h1>
                    <div id="date-picker-wrapper" class="flex items-center bg-gray-100 dark:bg-dark-700 rounded-lg px-3 py-1 border dark:border-gray-600">
                        <input type="date" id="data-selector" class="bg-transparent text-sm font-bold text-gray-700 dark:text-white outline-none">
                    </div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-8 bg-[#f8fafc] dark:bg-dark-900 relative">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 h-full">
                    <div class="lg:col-span-2 space-y-4">
                        <div id="screen-grade">
                             <div class="flex items-center justify-between mb-8">
                                <input type="text" id="busca-grade" oninput="window.filtrarLista('lista-programas', this.value)" placeholder="Pesquisar na grade..." class="w-full max-w-lg p-2 border rounded-lg dark:bg-dark-800 dark:text-white">
                                <button onclick="window.abrirCriacao()" class="bg-orange-500 text-white px-4 h-10 rounded-lg shadow-md hover:bg-orange-600 transition flex items-center text-sm font-bold gap-2">
                                    <i class="fas fa-plus"></i> Novo Programa
                                </button>
                            </div>
                            <div id="lista-programas" class="space-y-4"></div>
                        </div>
                        <div id="screen-standby" class="hidden">
                             <div id="lista-standby" class="space-y-4"></div>
                        </div>
                        <div id="screen-links" class="hidden">
                            <div id="lista-links-publica" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                        </div>
                        <div id="screen-passagem" class="hidden">
                             <div id="feed-passagem" class="space-y-4"></div>
                        </div>
                        <div id="screen-admin" class="hidden">
                             <div id="admin-banco-imagens" class="grid grid-cols-6 gap-3"></div>
                        </div>
                    </div>

                    <aside id="right-panel" class="sticky top-0 h-fit z-10">
                        <div id="view-form" class="bg-white dark:bg-dark-800 p-6 rounded-2xl shadow-lg border border-orange-200 dark:border-orange-900 hidden transition relative">
                            <h3 class="font-bold text-gray-800 dark:text-white mb-6 text-sm uppercase flex items-center justify-between">
                                <span id="form-title">Cadastrar</span>
                                <i class="fas fa-times cursor-pointer text-gray-400" onclick="window.cancelar()"></i>
                            </h3>
                            <form id="formCadastro" class="space-y-4">
                                <input type="hidden" id="edit-id">
                                <input id="in-titulo" placeholder="Nome do Programa" required class="w-full bg-transparent border-b dark:border-gray-600 py-2 outline-none text-sm dark:text-white font-bold">
                                <button type="submit" class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold text-xs uppercase shadow-md hover:bg-orange-600">Salvar</button>
                            </form>
                        </div>
                    </aside>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update, off, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALorKx-3IRMl1DYXM8-r5_tPb4JwfeSbQ",
            authDomain: "midias-sp.firebaseapp.com",
            databaseURL: "https://midias-sp-default-rtdb.firebaseio.com",
            projectId: "midias-sp",
            storageBucket: "midias-sp.firebasestorage.app",
            messagingSenderId: "550605985336",
            appId: "1:550605985336:web:7dd3a01aefb9248675b8cd"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // VARS
        let dataSelecionada = new Date().toISOString().split('T')[0];
        const refUsers = ref(db, 'users');

        // FUNÇÕES GLOBAIS
        window.cancelar = () => { document.getElementById('view-form').classList.add('hidden'); };
        window.abrirCriacao = () => { document.getElementById('formCadastro').reset(); document.getElementById('view-form').classList.remove('hidden'); };
        
        window.navegar = (tela) => {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('screen-grade').classList.add('hidden');
            document.getElementById('screen-standby').classList.add('hidden');
            document.getElementById('screen-passagem').classList.add('hidden');
            document.getElementById('screen-admin').classList.add('hidden');
            document.getElementById('screen-links').classList.add('hidden');
            
            // CORREÇÃO PEDIDA: FECHAR CAMPO AUTOMATICAMENTE
            window.cancelar(); 

            document.getElementById('screen-' + tela).classList.remove('hidden');
            document.getElementById('nav-' + tela).classList.add('active');
        };

        const verificarSessao = () => {
            if (localStorage.getItem('session_active') === 'true') {
                document.getElementById('tela-login').classList.add('hidden');
                document.getElementById('main-layout').classList.remove('hidden');
                document.getElementById('display-nome').innerText = localStorage.getItem('userName');
            }
        };

        window.logout = () => { localStorage.clear(); location.reload(); };

        // LOGIN LISTENER
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('login-user').value;
            const pass = document.getElementById('login-senha').value;
            
            if(user === 'admin' && pass === 'admin') {
                localStorage.setItem('session_active', 'true');
                localStorage.setItem('userName', 'Administrador');
                localStorage.setItem('userRole', 'admin');
                location.reload();
            } else {
                alert("Usuário ou senha inválidos.");
            }
        });

        // --- BLOCO INIT (FUNDAMENTAL PARA ENTRAR) ---
        verificarSessao();

    </script>
</body>
</html>
