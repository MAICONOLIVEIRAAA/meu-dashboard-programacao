<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias São Paulo - Programação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar-active { background-color: #fff5f2; color: #e15b31; border-right: 4px solid #e15b31; }
        .card-hover:hover { transform: translateY(-2px); transition: all 0.2s; }
        /* Esconder scrollbar mas manter funcionalidade */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#f4f7f9] text-gray-700 font-sans overflow-hidden">

    <div class="flex h-screen">
        <aside class="w-64 bg-white border-r flex flex-col py-8 items-center shrink-0">
            <div class="flex flex-col items-center mb-10 text-center px-4">
                <img src="https://i.pravatar.cc/150?u=maicon" class="w-20 h-20 rounded-full mb-3 border shadow-sm">
                <h3 class="font-bold text-gray-800">Maicon Carlos</h3>
                <p class="text-[10px] text-gray-400 uppercase tracking-tighter">De Araujo Oliveira</p>
            </div>
            <nav class="w-full space-y-1">
                <a href="#" class="flex items-center px-8 py-3 text-sm text-gray-400 hover:bg-gray-50"><i class="fas fa-th-large w-6"></i> Treinamento</a>
                <a href="#" onclick="showDefaultView()" class="flex items-center px-8 py-3 text-sm sidebar-active font-bold"><i class="fas fa-calendar-alt w-6"></i> Programação</a>
                <a href="#" class="flex items-center px-8 py-3 text-sm text-gray-400 hover:bg-gray-50"><i class="fas fa-bell w-6"></i> Stand-By</a>
                <a href="#" class="flex items-center px-8 py-3 text-sm text-gray-400 hover:bg-gray-50"><i class="fas fa-play-circle w-6"></i> Globoplay</a>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col min-w-0">
            <header class="h-16 bg-white border-b flex items-center justify-between px-8 shrink-0">
                <h1 class="text-xl font-bold">Midias São Paulo</h1>
                <div class="flex items-center space-x-4 text-[11px] text-gray-400 font-bold uppercase">
                    <span>Aspera</span><span>Backstage</span><span>Grabyo</span>
                    <i class="fas fa-search ml-4 text-gray-300"></i>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-8 bg-[#f8fafc] no-scrollbar">
                <div class="flex items-center space-x-4 mb-8">
                    <div class="relative flex-1 max-w-lg">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-300 text-sm"></i>
                        <input type="text" placeholder="Pesquisar..." class="w-full pl-10 pr-4 py-2 border rounded-lg text-sm outline-none focus:ring-1 focus:ring-orange-400">
                    </div>
                    <input type="text" value="07/01/2026" class="w-32 p-2 border rounded-lg text-sm text-center bg-white shadow-sm" readonly>
                    <button onclick="toggleForm()" class="bg-orange-500 text-white w-10 h-10 rounded-lg shadow-md hover:bg-orange-600 transition flex items-center justify-center text-xl font-bold">
                        +
                    </button>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 space-y-4" id="lista-programas">
                        </div>

                    <aside id="right-panel" class="space-y-6 sticky top-0">
                        <div id="view-details" class="bg-white p-6 rounded-2xl shadow-sm border">
                            <div class="flex items-center space-x-3 mb-6 border-b pb-4">
                                <div class="w-12 h-12 bg-gray-800 rounded flex items-center justify-center text-white"><i class="fas fa-tv"></i></div>
                                <div>
                                    <h4 class="font-bold text-sm">História de Amor</h4>
                                    <p class="text-[10px] text-gray-400">Edição Especial • Cap 114</p>
                                </div>
                            </div>
                            <textarea class="w-full h-24 p-3 bg-gray-50 border rounded-xl text-sm outline-none resize-none italic" placeholder="Digite uma passagem de serviço..."></textarea>
                            <button class="w-full mt-4 bg-orange-600 text-white py-3 rounded-xl font-bold shadow-md hover:bg-orange-700 transition">Enviar</button>
                        </div>

                        <div id="view-form" class="bg-white p-6 rounded-2xl shadow-lg border border-orange-200 hidden">
                            <h3 class="font-bold text-gray-800 mb-6 flex items-center">
                                <i class="fas fa-plus-circle text-orange-500 mr-2"></i> Novo Programa
                            </h3>
                            <form id="formCadastro" class="space-y-4">
                                <div>
                                    <label class="text-[10px] font-bold uppercase text-gray-400">Título do Programa</label>
                                    <input name="titulo" type="text" required class="w-full border-b py-2 outline-none focus:border-orange-500 text-sm">
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold uppercase text-gray-400">Subtítulo / Edição</label>
                                    <input name="sub" type="text" placeholder="Ex: Cap 115" class="w-full border-b py-2 outline-none focus:border-orange-500 text-sm">
                                </div>
                                <div class="flex space-x-4">
                                    <div class="flex-1">
                                        <label class="text-[10px] font-bold uppercase text-gray-400">Horário</label>
                                        <input name="hora" type="time" required class="w-full border-b py-2 outline-none text-sm">
                                    </div>
                                    <div class="flex-1">
                                        <label class="text-[10px] font-bold uppercase text-gray-400">Status</label>
                                        <select name="status" class="w-full border-b py-2 outline-none text-sm bg-white">
                                            <option value="Agendado">Agendado</option>
                                            <option value="No ar agora">No ar agora</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="flex space-x-3 pt-4">
                                    <button type="button" onclick="toggleForm()" class="flex-1 py-2 text-xs font-bold text-gray-400 hover:text-gray-600 uppercase">Cancelar</button>
                                    <button type="submit" class="flex-1 bg-orange-500 text-white py-2 rounded-lg font-bold text-xs shadow-md hover:bg-orange-600 transition uppercase">Salvar</button>
                                </div>
                            </form>
                        </div>
                    </aside>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Função para alternar entre Detalhes e Formulário
        function toggleForm() {
            const details = document.getElementById('view-details');
            const form = document.getElementById('view-form');
            
            if (form.classList.contains('hidden')) {
                details.classList.add('hidden');
                form.classList.remove('hidden');
            } else {
                details.classList.remove('hidden');
                form.classList.add('hidden');
            }
        }

        // Renderizar Lista
        function renderizar() {
            const container = document.getElementById('lista-programas');
            const defaultData = [
                { id: 1, titulo: "História de Amor", subtitulo: "Edição Especial • Cap 114", hora: "00:00", status: "No ar agora" }
            ];
            
            const programas = JSON.parse(localStorage.getItem('meusProgramas')) || defaultData;

            container.innerHTML = programas.map(p => `
                <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center space-x-4 border-l-4 ${p.status === 'No ar agora' ? 'border-green-500' : 'border-orange-500'} card-hover">
                    <div class="w-24 h-16 rounded-xl bg-gray-100 flex items-center justify-center text-gray-300 text-xs uppercase font-bold">Midia</div>
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <h4 class="font-bold text-gray-800">${p.titulo}</h4>
                            ${p.status === 'No ar agora' ? '<span class="text-[9px] font-bold bg-green-100 text-green-600 px-2 py-0.5 rounded-full uppercase tracking-tighter">No ar agora</span>' : ''}
                        </div>
                        <p class="text-xs text-gray-400">${p.subtitulo}</p>
                        <div class="mt-2 text-sm flex items-center">
                            <span class="text-orange-600 font-bold">${p.hora}</span>
                            <span class="text-gray-200 mx-2 text-xs">|</span>
                            <span class="text-gray-400 text-[11px]">Maicon Carlos</span>
                        </div>
                    </div>
                    <i class="fas fa-pencil-alt text-gray-200 cursor-pointer hover:text-orange-400 transition ml-2"></i>
                </div>
            `).join('');
        }

        // Lógica do Formulário
        document.getElementById('formCadastro').onsubmit = (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            const novo = {
                id: Date.now(),
                titulo: formData.get('titulo'),
                subtitulo: formData.get('sub'),
                hora: formData.get('hora'),
                status: formData.get('status')
            };

            const programas = JSON.parse(localStorage.getItem('meusProgramas')) || [];
            programas.push(novo);
            localStorage.setItem('meusProgramas', JSON.stringify(programas));
            
            e.target.reset(); // Limpa o formulário
            toggleForm();     // Volta para a visualização de detalhes
            renderizar();     // Atualiza a lista na tela
        };

        window.onload = renderizar;
    </script>
</body>
</html>
