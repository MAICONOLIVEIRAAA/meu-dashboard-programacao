<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Novo Programa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#e9ecef] min-h-screen p-4 md:p-12 font-sans">

    <div class="max-w-6xl mx-auto bg-white rounded-lg shadow-xl overflow-hidden border border-pink-500">
        <div class="bg-black text-white p-4 flex justify-between items-center text-[10px] uppercase font-bold">
            <div class="flex space-x-6">
                <span class="flex flex-col items-center opacity-70"><i class="fas fa-camera mb-1"></i> Banco de Imagens</span>
                <span class="flex flex-col items-center border-b-2 border-white pb-1"><i class="fas fa-calendar-alt mb-1"></i> Programação</span>
                <span class="flex flex-col items-center opacity-70"><i class="fas fa-book mb-1"></i> Treinamentos</span>
            </div>
            <div class="text-xl italic font-serif">globo</div>
        </div>

        <div class="p-8">
            <h2 class="text-xl font-bold text-[#1a2b48] mb-8 text-center uppercase tracking-widest">Cadastrar Novo Programa</h2>
            
            <form id="formCadastro" class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div>
                    <label class="text-[11px] font-bold uppercase text-gray-500">Programa</label>
                    <input name="programa" type="text" required class="w-full border-b-2 border-gray-200 focus:border-pink-500 outline-none py-2 transition">
                </div>
                <div>
                    <label class="text-[11px] font-bold uppercase text-gray-500">Título</label>
                    <input name="titulo" type="text" required class="w-full border-b-2 border-gray-200 focus:border-pink-500 outline-none py-2 transition">
                </div>
                <div>
                    <label class="text-[11px] font-bold uppercase text-gray-500">Versão/Cap</label>
                    <input name="versao" type="text" placeholder="Ex: Cap 115" class="w-full border-b-2 border-gray-200 focus:border-pink-500 outline-none py-2 transition">
                </div>
                <div>
                    <label class="text-[11px] font-bold uppercase text-gray-500">Status</label>
                    <select name="status" class="w-full border-b-2 border-gray-200 outline-none py-2 bg-white">
                        <option value="Agendado">Agendado</option>
                        <option value="No ar agora">No ar agora</option>
                    </select>
                </div>
                <div>
                    <label class="text-[11px] font-bold uppercase text-gray-500">Horário Exibição</label>
                    <input name="hora" type="time" required class="w-full border-b-2 border-gray-200 outline-none py-2">
                </div>

                <div class="col-span-1 md:col-span-3 flex justify-between mt-12">
                    <button type="button" class="bg-[#d81b60] text-white px-8 py-2 rounded flex items-center space-x-2 shadow-lg"><i class="fas fa-trash"></i> <span>Apagar</span></button>
                    <div class="space-x-4">
                        <button type="submit" class="bg-[#d81b60] text-white px-10 py-2 rounded font-bold shadow-lg hover:bg-pink-700 transition">Salvar</button>
                        <button type="button" onclick="window.location.href='index.html'" class="bg-[#d81b60] text-white px-10 py-2 rounded font-bold shadow-lg opacity-90">Voltar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('formCadastro').onsubmit = (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            const novo = {
                id: Date.now(),
                titulo: formData.get('titulo'),
                subtitulo: formData.get('programa') + " • " + formData.get('versao'),
                hora: formData.get('hora'),
                status: formData.get('status')
            };

            const programas = JSON.parse(localStorage.getItem('meusProgramas')) || [];
            programas.push(novo);
            localStorage.setItem('meusProgramas', JSON.stringify(programas));

            alert('Programa salvo com sucesso!');
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
